---
- module_defaults:
    group/aws:
      access_key: "{{ aws_access_key }}"
      secret_key: "{{ aws_secret_key }}"
      session_token: "{{ security_token | default(omit) }}"
      region: "{{ aws_region }}"
  collections:
    - amazon.aws

  block:
  - include_tasks: 'basic.yml'
  # Permissions missing
  #- include_tasks: 'rotation.yml'
  # Multi-Region CI not supported (yet)
  #- include_tasks: 'replication.yml'
  # Replica lifecycle management tests - disabled (CI doesn't support multi-region)
  # Run manually before releases with appropriate AWS credentials
  #- include_tasks: 'replication_lifecycle.yml'
