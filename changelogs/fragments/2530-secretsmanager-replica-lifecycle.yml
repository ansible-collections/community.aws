---
minor_changes:
  - secretsmanager_secret - add ``replication_action`` parameter to manage the lifecycle of secret replicas, supporting ``promote_replica`` and ``remove_regions`` (https://github.com/ansible-collections/community.aws/pull/2530).
  - secretsmanager_secret - add ``target_region`` parameter to specify the AWS region when promoting a replica via ``replication_action=promote_replica`` (https://github.com/ansible-collections/community.aws/pull/2530).
  - secretsmanager_secret - add ``remove_replica_regions`` parameter to specify regions from which to remove replication via ``replication_action=remove_regions`` (https://github.com/ansible-collections/community.aws/pull/2530).
